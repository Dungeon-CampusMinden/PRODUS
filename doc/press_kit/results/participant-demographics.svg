<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Participant demographics</title>
  <desc id="desc">Stacked bar charts for participant gender and age clusters. Gender: 219 male, 55 female, 20 other or unspecified. Age: 8 under 10, 81 aged 10 to 12, 80 aged 13 to 15, 92 aged 16 to 18, 13 aged 19 or older, 20 unspecified.</desc>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="48" y="58" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#202124">Participant Demographics</text>
  <text x="48" y="91" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6368">Gender and age clusters from the 294 evaluated workshop participants</text>

  <g font-family="Inter, Arial, sans-serif">
    <text x="48" y="150" font-size="20" font-weight="700" fill="#202124">Gender</text>
    <rect x="48" y="172" width="610" height="42" fill="#4e79a7"/>
    <rect x="658" y="172" width="153" height="42" fill="#f28e2b"/>
    <rect x="811" y="172" width="56" height="42" fill="#9aa0a6"/>
    <text x="875" y="200" font-size="18" font-weight="700" fill="#202124">294</text>

    <g font-size="14" fill="#202124">
      <rect x="48" y="235" width="14" height="14" fill="#4e79a7"/>
      <text x="70" y="247">Male: 219 (74%)</text>
      <rect x="235" y="235" width="14" height="14" fill="#f28e2b"/>
      <text x="257" y="247">Female: 55 (19%)</text>
      <rect x="430" y="235" width="14" height="14" fill="#9aa0a6"/>
      <text x="452" y="247">Other / unspecified: 20 (7%)</text>
    </g>

    <text x="48" y="315" font-size="20" font-weight="700" fill="#202124">Age Clusters</text>
    <rect x="48" y="337" width="22" height="42" fill="#e15759"/>
    <rect x="70" y="337" width="226" height="42" fill="#f28e2b"/>
    <rect x="296" y="337" width="223" height="42" fill="#59a14f"/>
    <rect x="519" y="337" width="256" height="42" fill="#4e79a7"/>
    <rect x="775" y="337" width="36" height="42" fill="#b07aa1"/>
    <rect x="811" y="337" width="56" height="42" fill="#9aa0a6"/>
    <text x="875" y="365" font-size="18" font-weight="700" fill="#202124">294</text>

    <g font-size="14" fill="#202124">
      <rect x="48" y="405" width="14" height="14" fill="#e15759"/>
      <text x="70" y="417">&lt;10: 8 (3%)</text>
      <rect x="165" y="405" width="14" height="14" fill="#f28e2b"/>
      <text x="187" y="417">10-12: 81 (28%)</text>
      <rect x="320" y="405" width="14" height="14" fill="#59a14f"/>
      <text x="342" y="417">13-15: 80 (27%)</text>
      <rect x="475" y="405" width="14" height="14" fill="#4e79a7"/>
      <text x="497" y="417">16-18: 92 (31%)</text>
      <rect x="635" y="405" width="14" height="14" fill="#b07aa1"/>
      <text x="657" y="417">19+: 13 (4%)</text>
      <rect x="755" y="405" width="14" height="14" fill="#9aa0a6"/>
      <text x="777" y="417">Unspecified: 20 (7%)</text>
    </g>
  </g>
</svg>
